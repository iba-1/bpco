name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  maestro-ios:
    name: Maestro E2E (iOS simulator)
    runs-on: macos-26
    # macos-15 only ships Xcode <= 26.3 / Swift 6.2.3, which errors on Expo
    # SDK 57's expo-modules-jsi (data-race + SWIFT_RETURNS_RETAINED). macos-26
    # ships Xcode 26.4+ / Swift 6.3, which tolerates it (warnings only).
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # macos-15 default Xcode may lack iPhone 17 / iOS 26 — pin the newest
      # installed Xcode (Expo SDK 57 needs a recent Xcode) and log the choice.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          # Pick the first available iPhone simulator's UDID (stable across
          # runner images and Xcode versions).
          echo "SIM_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devs=[e["udid"] for rt in d["devices"].values() for e in rt if "iPhone" in e["name"]]; print(devs[0])')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Start backend + OIDC stub
        working-directory: backend
        env:
          NODE_ENV: test
          VERNE_GATE_BASE_URL: http://127.0.0.1:9999
          VERNE_GATE_CLIENT_ID: test-client
          SESSION_SECRET: test-secret-32-chars-long-123456
          PORT: 3000
        run: |
          npx tsx src/oidc-stub.ts > /tmp/oidc.log 2>&1 &
          npx tsx src/index.ts > /tmp/api.log 2>&1 &
          sleep 4
          curl -sf http://127.0.0.1:3000/health || (cat /tmp/api.log; exit 1)

      - name: Cache CocoaPods + DerivedData (fast re-runs)
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            app/ios/build
            ~/Library/Caches/CocoaPods
          # Podfile.lock is generated by prebuild (gitignored), so hash the
          # npm lockfile that drives pod versions as the stable cache key.
          key: ${{ runner.os }}-ios-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Build iOS app (Release embeds JS bundle)
        working-directory: app
        run: |
          npx expo prebuild --platform ios --no-install
          npx pod-install
          xcodebuild -workspace ios/BPCOCompanion.xcworkspace \
            -scheme BPCOCompanion -configuration Release \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=${{ env.SIM_UDID }}" \
            -derivedDataPath build build

      - name: Boot simulator + install app
        run: |
          xcrun simctl boot "${{ env.SIM_UDID }}" 2>/dev/null || true
          xcrun simctl bootstatus "${{ env.SIM_UDID }}" -b
          xcrun simctl install booted \
            app/build/Build/Products/Release-iphonesimulator/BPCOCompanion.app
          xcrun simctl launch booted it.bpco.companion

      - name: Run Maestro flows
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          mkdir -p docs/compliance/evidence/test-reports
          maestro test -e API_URL=${{ env.API_URL }} \
            --format junit \
            --output docs/compliance/evidence/test-reports/e2e-report.xml \
            .maestro/flows

      - name: Dump simulator hierarchy (diagnose failure)
        if: always()
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro hierarchy > /tmp/sim-hierarchy.json 2>&1 || true
          python3 -c "
import json
try:
    data=json.load(open('/tmp/sim-hierarchy.json'))
    def walk(n,d=0):
        a=n.get('attributes',{})
        t=a.get('accessibilityText',''); rid=a.get('resource-id','')
        if t or rid: print(' '*d + repr((t or rid)[:60]))
        for c in n.get('children',[]): walk(c,d+2)
    walk(data)
except Exception as e:
    print('hierarchy parse failed:', e)
" | head -50

      - name: Persist E2E evidence
        run: |
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@bpco.local"
          git add docs/compliance/evidence/test-reports/e2e-report.xml
          git diff --cached --quiet || git commit -m "evidence: E2E report (Maestro)"

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: docs/compliance/evidence/test-reports/e2e-report.xml
          if-no-files-found: warn