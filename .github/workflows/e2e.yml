name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  maestro-ios:
    name: Maestro E2E (iOS simulator)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # macos-15 default Xcode may lack iPhone 17 / iOS 26 — pin the newest
      # installed Xcode (Expo SDK 57 needs a recent Xcode) and log the choice.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          echo "SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9A-Za-z ]+' | sort -u | tail -1)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Start backend + OIDC stub
        working-directory: backend
        env:
          NODE_ENV: test
          VERNE_GATE_BASE_URL: http://127.0.0.1:9999
          VERNE_GATE_CLIENT_ID: test-client
          SESSION_SECRET: test-secret-32-chars-long-123456
          PORT: 3000
        run: |
          npx tsx src/oidc-stub.ts > /tmp/oidc.log 2>&1 &
          npx tsx src/index.ts > /tmp/api.log 2>&1 &
          sleep 4
          curl -sf http://127.0.0.1:3000/health || (cat /tmp/api.log; exit 1)

      - name: Build iOS app (Release embeds JS bundle)
        working-directory: app
        run: |
          npx expo prebuild --platform ios --no-install
          npx pod-install
          xcodebuild -workspace ios/BPCOCompanion.xcworkspace \
            -scheme BPCOCompanion -configuration Release \
            -sdk iphonesimulator -destination "platform=iOS Simulator,name=${{ env.SIM_NAME }}" \
            -derivedDataPath build build

      - name: Boot simulator + install app
        run: |
          xcrun simctl boot "${{ env.SIM_NAME }}" || true
          xcrun simctl install booted \
            app/build/Build/Products/Release-iphonesimulator/BPCOCompanion.app

      - name: Run Maestro flows
        env:
          PATH: ${{ runner.tool_cache }}/maestro/bin:$PATH
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          mkdir -p docs/compliance/evidence/test-reports
          maestro test -e API_URL=${{ env.API_URL }} \
            --format junit \
            --output docs/compliance/evidence/test-reports/e2e-report.xml \
            .maestro/flows

      - name: Persist E2E evidence
        run: |
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@bpco.local"
          git add docs/compliance/evidence/test-reports/e2e-report.xml
          git diff --cached --quiet || git commit -m "evidence: E2E report (Maestro)"

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: docs/compliance/evidence/test-reports/e2e-report.xml
          if-no-files-found: warn