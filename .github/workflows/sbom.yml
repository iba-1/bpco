name: SBOM

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM from lockfile
        run: |
          npx @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --validate \
            --output-format JSON \
            --output-file sbom.cdx.json

      - name: Verify SBOM is non-empty
        run: |
          jq -e '.components | length > 0' sbom.cdx.json >/dev/null \
            || { echo "SBOM has no components"; exit 1; }

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90